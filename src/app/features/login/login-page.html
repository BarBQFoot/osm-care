<div class="login-screen">
  <div class="login-card">
    <div class="login-brand"><span class="login-mark">ม</span><strong>My OSM</strong><small>สมุดบันทึก อสม.</small></div>
    <h1>ป้อนรหัสเพื่อเข้าใช้งาน</h1>
    <p class="login-hint">รหัสนี้ใช้โดยผู้ดูแลหนึ่งคนเท่านั้น</p>
    <form (submit)="$event.preventDefault(); submit()">
      <input class="login-input" type="password" inputmode="text" autocomplete="current-password" placeholder="รหัสผ่าน" [value]="code()" (input)="setCode($any($event.target).value)" aria-label="รหัสผ่าน">
      @if (loginError()) {<p class="field-error" role="alert">{{ loginError() }}</p>}
      <button class="button button-primary login-button" type="submit" [disabled]="checking()">{{ checking() ? 'กำลังตรวจรหัส…' : 'เข้าใช้งาน' }}</button>
    </form>
  </div>
</div>
